# Локальная разработка: собирает образ из исходников.
# Запуск одной командой: docker compose up -d --build
services:
  app:
    build:
      context: .
      args:
        APP_VERSION: local
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db          # база доступна по имени сервиса
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-guestbook}
      POSTGRES_USER: ${POSTGRES_USER:-guestbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guestbook}
      POSTGRES_USER: ${POSTGRES_USER:-guestbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"  # порт на хосте (5433 — чтобы не конфликтовать с локальным PostgreSQL), нужен для pytest
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
