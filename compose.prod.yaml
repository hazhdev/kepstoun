# «Прод»: ничего не собирает, берёт готовый образ из ghcr.io по тегу.
# Выкат/откат:  ./scripts/deploy.sh v1.1.0   /   ./scripts/deploy.sh v1.0.0
name: guestbook-prod
services:
  app:
    image: ${IMAGE:?задайте IMAGE в .env}:${APP_TAG:?задайте APP_TAG, например v1.0.0}
    ports:
      - "8080:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-guestbook}
      POSTGRES_USER: ${POSTGRES_USER:-guestbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guestbook}
      POSTGRES_USER: ${POSTGRES_USER:-guestbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
